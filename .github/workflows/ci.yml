name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prirtem_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: prirtem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prirtem_test -d prirtem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://prirtem_test:${{ github.run_id }}@127.0.0.1:5432/prirtem_test
      JWT_SECRET: ${{ github.sha }}
      APP_CLIENT_URL: http://localhost:5173
      RUN_DB_TESTS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run db:migrate
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm audit --omit=dev
        working-directory: server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm audit
        working-directory: client

  container:
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag prirtem-fuel:ci .
